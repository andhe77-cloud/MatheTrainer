<style>
:root{--bg1:#ffe9c7;--bg2:#ffc9a3;--ink:#3b2417;--card:#fffaf0;--accent:#e0662b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1b3d;--bg2:#4a2a44;--ink:#fbe9d6;--card:#3a2740;--accent:#ff9a5c}}

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg1);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;max-width:520px;margin:0 auto;background:linear-gradient(var(--bg1),var(--bg2))}
canvas{width:100%;height:100%;display:block}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(0,0,0,.35)}
.card{background:var(--card);border-radius:22px;padding:22px 20px;max-width:340px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
h1{margin:0 0 8px;font-size:34px;color:var(--accent)}
p{margin:6px 0;font-size:16px;line-height:1.35}
button{margin-top:12px;font:inherit;font-weight:700;font-size:20px;padding:12px 26px;border:0;border-radius:40px;background:var(--accent);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hide{display:none}
</style>

  if(!boss&&!bossDone&&score>=50)startBoss();if(boss)bossTick();else if(t%Math.max(14,Math.floor(45-lvl*3))===0){const k=pick();items.push({k,x:20+Math.random()*(W-40),y:-30,v:(2+Math.random()*1.5)*(1+lvl*.12),r:Math.random()*6,vr:(Math.random()-.5)*.15})}
  const sp=frozen>0?.45:1;
  let key=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(key)tx=Math.max(0,Math.min(W,tx+key*10));
  pl.x+=(tx-pl.x)*.22*sp;
  const py=H-pl.h-6;
  for(const it of items){it.y+=it.v*(frozen>0?.7:1);it.r+=it.vr;
   if(!it.dead&&it.y>py+pl.h*.45&&it.y<py+pl.h*.9&&Math.abs(it.x-pl.x)<pl.w*.48){
    it.dead=1;const k=it.k;
    if(k.bad){lives--;shake=14;say(bad[Math.random()*bad.length|0]);pop(it.x,it.y,"−1 ❤️","#d22");if(lives<=0)end()}
    else if(k.ice){frozen=150;say("Brrr… Gänsehaut!");pop(it.x,it.y,"Brrr!","#39f")}
    else if(k.gold){rausch=420;say("KÄSE-RAUSCH!!!");pop(it.x,it.y,"KÄSE ×2","#e6a800")}
    else{const p=k.p*(rausch>0?2:1);score+=p;pop(it.x,it.y,"+"+p,"#2a8a2a");if(Math.random()<.35)say(lines[Math.random()*lines.length|0]);pl.sq=1;if(boss)proj.push({x:pl.x,y:py,d:p})}
    hud()}
  }
  items=items.filter(i=>!i.dead&&i.y<H+40);
  for(const q of proj){q.y-=9;if(boss&&boss.in<=0&&!q.dead&&q.y<bossY()+55&&Math.abs(q.x-boss.x)<75){q.dead=1;boss.hp-=q.d;boss.fl=8;pop(q.x,q.y,"-"+q.d,"#c00");if(boss.hp<=0){win();break}}}
  proj=proj.filter(q=>!q.dead&&q.y>-20);
  if(frozen>0)frozen--;if(rausch>0){rausch--;if(rausch===0)hud()}
 }
 // draw items
 ctx.textAlign="center";ctx.textBaseline="middle";
 if(items)for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.r);ctx.font="38px serif";ctx.fillText(it.k.e,0,0);ctx.restore()}
 if(boss){const by=bossY();ctx.save();ctx.translate(boss.x+(boss.fl>0?(Math.random()-.5)*10:0),by);ctx.rotate(Math.sin(t*.1)*.12);ctx.globalAlpha=boss.fl>0?.6:1;ctx.font="120px serif";ctx.fillText("🧦",0,0);ctx.restore();ctx.globalAlpha=1;const bw=W*.6;ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(W*.2,by+70,bw,12);ctx.fillStyle="#d22";ctx.fillRect(W*.2,by+70,bw*Math.max(boss.hp,0)/boss.max,12)}
 ctx.font="30px serif";for(const q of proj)ctx.fillText("🍞",q.x,q.y);
 // draw player
 if(pl&&state!=="menu"&&img.complete){
  const py=H-pl.h-6;let sq=pl.sq?pl.sq:0;if(pl.sq)pl.sq=Math.max(0,pl.sq-.08);
  const wob=Math.sin(t*.15)*.03*(frozen>0?4:1),sx=1+sq*.15,sy=1-sq*.12;
  ctx.save();ctx.translate((pl.x||0)+(shake>0?(Math.random()-.5)*shake:0),py+pl.h);ctx.rotate(wob);ctx.scale(sx,sy);
  if(frozen>0)ctx.filter="hue-rotate(160deg) saturate(1.6)";
  if(rausch>0)ctx.filter="saturate(2) hue-rotate("+(t*8%360)+"deg)";
  ctx.drawImage(img,-pl.w/2,-pl.h,pl.w,pl.h);ctx.restore();ctx.filter="none";
  if(shake>0)shake--;
  if(bubble.t>0){bubble.t--;const bx=Math.max(70,Math.min(W-70,pl.x)),by=py-18;ctx.font="bold 15px Trebuchet MS,sans-serif";const w=ctx.measureText(bubble.s).width+22;
   ctx.fillStyle="#fff";ctx.strokeStyle="#3b2417";ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(bx-w/2,by-30,w,30,14);ctx.fill();ctx.stroke();
   ctx.fillStyle="#3b2417";ctx.fillText(bubble.s,bx,by-14)}
 }
 for(const f of fx){f.y-=1.2;f.a-=.02;ctx.globalAlpha=Math.max(f.a,0);ctx.fillStyle=f.c;ctx.font="bold 24px Trebuchet MS,sans-serif";ctx.fillText(f.s,f.x,f.y)}
 ctx.globalAlpha=1;fx=fx.filter(f=>f.a>0);
 if(frozen>0){ctx.fillStyle="rgba(120,180,255,.15)";ctx.fillRect(0,0,W,H)}
 requestAnimationFrame(loop)}
function move(e){const r=cv.getBoundingClientRect();tx=e.clientX-r.left}
cv.addEventListener("pointermove",move);cv.addEventListener("pointerdown",move);
addEventListener("keydown",e=>keys[e.key]=1);addEventListener("keyup",e=>keys[e.key]=0);
addEventListener("resize",()=>{if(pl)resize()});
$("go").onclick=start;$("again").onclick=start;$("again2").onclick=start;
$("best").textContent="⭐ "+best;
img.onload=resize;resize();loop();
</script>
